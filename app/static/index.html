<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindSight</title>
  <link rel="stylesheet" href="/static/chat.css">
  <script type="module" src="/static/chat.js"></script>
</head>
<body>
  <main>
    <header>
      <div><h1>MindSight</h1><p id="mode">Conversation simulée</p></div>
      <button id="reset" type="button">Recommencer</button>
    </header>
    <ol id="messages" aria-label="Conversation" aria-live="polite"></ol>
    <form>
      <label for="answer">Ta réponse</label>
      <textarea id="answer" name="answer" rows="3" maxlength="2000" required></textarea>
      <button id="send" type="submit" disabled>Envoyer</button>
      <p id="status" role="status"></p>
    </form>
    <section id="reasoning" aria-labelledby="reasoning-title" hidden>
      <h2 id="reasoning-title">Analyse des traits</h2>
      <p id="reasoning-status" role="status"></p>
      <h3>Indices et interprétations par tour</h3>
      <div id="reasoning-turns"></div>
      <h3>État des attributions</h3>
      <p class="reasoning-note">Les valeurs reflètent les indices recueillis dans cet échange. Le calcul retient le poids maximal par épisode et par sens.</p>
      <div id="reasoning-dimensions"></div>
    </section>
  </main>
</body>
</html>
