version: 2
quantification:
  weights: {direct: 1.0, indirect: 0.5}
  saturation: 1.0

dimensions:
  - id: sensibilite_apparente
    family: Personnalité apparente
    label: Sensibilité apparente
    definition: Manifeste une attention à des nuances perceptives ou à l'ambiance d'une situation.
    exclusions: [Description détaillée seule, Intensité d'une émotion sans attention à ses nuances]
  - id: extraversion
    family: Personnalité apparente
    label: Extraversion exprimée
    definition: Dit rechercher ou apprécier activement le contact social, ou rapporte un exemple de cette démarche.
    exclusions: [Longueur de la réponse, Aisance verbale seule]
  - id: reserve
    family: Personnalité apparente
    label: Réserve exprimée
    definition: Décrit une retenue dans la prise de parole ou l'entrée en relation.
    exclusions: [Brièveté de la réponse seule]
  - id: assurance
    family: Personnalité apparente
    label: Assurance
    definition: Exprime de la confiance dans sa manière d'agir ou de décider dans une situation précise.
    exclusions: [Ton catégorique seul]
  - id: analyse
    family: Fonctionnement intellectuel
    label: Démarche analytique
    definition: Décompose un problème, compare des options ou explicite des critères.
  - id: intuition
    family: Fonctionnement intellectuel
    label: Intuition exprimée
    definition: Explique un choix en s'appuyant sur une impression spontanée.
  - id: creativite
    family: Fonctionnement intellectuel
    label: Créativité exprimée
    definition: Imagine un rapprochement original ou une autre manière de faire.
  - id: logique
    family: Fonctionnement intellectuel
    label: Raisonnement logique
    definition: Relie explicitement des prémisses à une conséquence ou vérifie la cohérence d'une conclusion.
    exclusions: [Simple inventaire d'options, Usage isolé d'un connecteur logique]
  - id: abstraction
    family: Fonctionnement intellectuel
    label: Pensée abstraite
    definition: Passe d'un cas concret à un principe général, ou met en relation des idées générales.
    exclusions: [Vocabulaire abstrait seul]
  - id: expression_emotionnelle
    family: Fonctionnement émotionnel
    label: Expression émotionnelle
    definition: Nomme, décrit ou communique un ressenti qui lui est attribuable.
    exclusions: [Émotion d’un tiers, Ressenti supposé à partir d'une image seule]
  - id: regulation_emotionnelle
    family: Fonctionnement émotionnel
    label: Régulation émotionnelle
    definition: Décrit une action destinée à traverser ou moduler une émotion.
  - id: sensibilite_emotionnelle
    family: Fonctionnement émotionnel
    label: Sensibilité émotionnelle
    definition: Décrit ce qui le touche émotionnellement ou les nuances qu'il perçoit dans son propre ressenti.
    exclusions: [Réaction rapide seule, Attention sensorielle sans ressenti formulé]
  - id: reactivite_emotionnelle
    family: Fonctionnement émotionnel
    label: Réactivité émotionnelle
    definition: Raconte une variation rapide ou marquée de son état émotionnel en réponse à un événement identifiable.
  - id: empathie
    family: Fonctionnement relationnel
    label: Empathie exprimée
    definition: Cherche à comprendre le vécu d'autrui ou adapte son action à ce vécu.
    exclusions: [Accord poli seul, Émotion attribuée sans justification]
  - id: ecoute
    family: Fonctionnement relationnel
    label: Écoute
    definition: Reformule, demande des précisions ou prend concrètement en compte les propos d'autrui.
    exclusions: [Accord seul, Simple présence lors d'un échange]
  - id: cooperation
    family: Fonctionnement relationnel
    label: Coopération
    definition: Partage le travail, cherche une solution commune ou inclut autrui dans la décision.
  - id: affirmation_de_soi
    family: Fonctionnement relationnel
    label: Affirmation de soi
    definition: Formule sa préférence, sa limite ou son désaccord dans un échange.
    examples: ["J’ai dit que je préférais la seconde option et j’ai expliqué pourquoi."]
    exclusions: [Proposition sans expression d'une position personnelle, Décision imposée seule]
