version: 4
quantification:
  weights: {direct: 4, indirect: 2}

dimensions:
  - id: enthousiasme
    family: Expression
    label: Enthousiasme
    definition: Exprime un élan, un plaisir anticipé ou une envie marquée de faire quelque chose.
    exclusions: [Ponctuation expressive seule, Simple préférence]
  - id: reveur
    family: Expression
    label: Rêveur
    definition: Développe une rêverie, une possibilité ou un monde imaginé au-delà du point de départ.
    allow_fiction: true
    exclusions: [Simple réponse à une question imaginaire, Détail fourni par la question]
  - id: passionne
    family: Expression
    label: Passionné
    definition: Exprime un attachement soutenu à un sujet ou décrit le temps et l'énergie qu'il y consacre.
    exclusions: [Enthousiasme ponctuel, Goût déclaré sans autre indication]
  - id: creativite
    family: Expression
    label: Créativité
    definition: Produit une association originale, transforme la prémisse ou invente un mécanisme inattendu.
    allow_fiction: true
    exclusions: [Longueur ou richesse lexicale seule, Reprise d'une idée de la question]
  - id: bienveillance
    family: Fonctionnement relationnel
    label: Bienveillance
    definition: Exprime une attention au bien d'autrui ou décrit une action destinée à l'aider.
    exclusions: [Formule de politesse seule, Bienveillance d'un personnage seule]
  - id: force_de_proposition
    family: Bonus
    label: Force de proposition
    definition: Prend l'initiative d'ajouter une option, d'avancer une solution ou de proposer une suite concrète.
    exclusions: [Préférence seule, Simple exécution d'une consigne]
  - id: impulsivite
    family: Fonctionnement émotionnel
    label: Impulsivité
    definition: Décrit une réaction immédiate et peu réfléchie, notamment sous l'effet de la colère.
    exclusions: [Colère sans réaction impulsive, Agressivité prêtée à un animal ou un personnage]
  - id: autocritique
    family: Rapport à soi
    label: Autocritique
    definition: Revient sur sa propre décision, son comportement ou une erreur en explicitant ce qu'il remet en question.
    exclusions: [Correction factuelle seule, Critique attribuée à un tiers]
  - id: domination
    family: Fonctionnement relationnel
    label: Domination
    definition: Exprime une volonté d'imposer ses décisions aux autres ou décrit avoir limité leur choix pour faire prévaloir le sien.
    exclusions: [Confiance en soi, Initiative ou désaccord sans contrôle d'autrui]
  - id: extraversion
    family: Fonctionnement relationnel
    label: Extraversion
    definition: Dit rechercher ou apprécier les interactions sociales, ou décrit une démarche allant dans ce sens.
    exclusions: [Longueur de la réponse, Aisance verbale seule]
  - id: introversion
    family: Fonctionnement relationnel
    label: Introversion
    definition: Exprime une préférence pour la solitude ou les petits groupes, ou dit avoir besoin de moments seuls pour retrouver de l'énergie.
    exclusions: [Réponse brève, Timidité supposée, Absence d'indice d'extraversion]
  - id: confiance_en_soi
    family: Rapport à soi
    label: Confiance en soi
    definition: Exprime sa confiance dans sa capacité à agir, choisir ou faire face à une situation.
    exclusions: [Ton catégorique seul, Contrôle exercé sur les autres]
  - id: manque_de_confiance_en_soi
    family: Rapport à soi
    label: Absence de confiance en soi
    definition: Exprime un doute sur ses propres capacités ou raconte avoir renoncé en pensant ne pas être à la hauteur.
    exclusions: [Doute sur la situation seule, Hésitation ponctuelle sans mise en cause de soi, Absence d'indice de confiance en soi]
  - id: analytique
    family: Fonctionnement intellectuel
    label: Analytique
    definition: Décompose une situation, ordonne plusieurs éléments ou compare des options en expliquant ses critères.
    exclusions: [Énumération sans mise en relation, Forme géométrique décrite seule]
  - id: humour
    family: Expression
    label: Humour
    definition: Produit un jeu de mots, une chute, un décalage volontaire ou de l'autodérision.
    allow_fiction: true
    exclusions: [Humour contenu dans la question, Rire ou emoji seul]
  - id: angoisse
    family: Fonctionnement émotionnel
    label: Angoisse exprimée
    definition: Exprime une inquiétude marquée, une tension persistante ou des pensées pénibles qui reviennent.
    exclusions: [Scène sombre seule, Peur d'un personnage, Diagnostic déduit du texte]
