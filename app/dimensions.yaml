version: 6
quantification:
  strategy: contrast
  weights: {direct: 5, indirect: 2}

dimensions:
  - id: analytique
    family: Raisonnement
    label: Analytique
    definition: Décompose un problème, compare des options selon des critères ou relie des causes et des conséquences pour justifier une conclusion.
    allow_hypothetical_reasoning: true
    exclusions: [Énumération sans mise en relation, Forme géométrique décrite seule]
    anchors:
      leger: Donne une seule raison simple à un choix.
      net: Compare des options en expliquant le critère qui les départage.
      frappant: Décompose le problème et arbitre entre des contraintes avec un raisonnement explicite.
  - id: enthousiasme
    family: Expression
    label: Enthousiasme
    definition: Exprime un élan, un plaisir marqué ou un engagement énergique envers une activité ou une idée.
    exclusions: [Ponctuation expressive seule, Sujet repris de la question sans élan exprimé]
    anchors:
      leger: Exprime un petit plaisir ou un élan perceptible et situé.
      net: Explique concrètement ce qui lui donne envie de s'investir.
      frappant: Décrit un élan intense qui entraîne des actions concrètes ou une mobilisation soutenue.
  - id: extraversion
    family: Relation aux autres
    label: Extraversion
    definition: Recherche les interactions, prend l'initiative du contact ou dit tirer de l'énergie des échanges sociaux.
    exclusions: [Longueur de la réponse, Aisance verbale seule, Présence passive dans un groupe]
    anchors:
      leger: Exprime un intérêt situé pour aller vers les autres.
      net: Raconte comment il a pris l'initiative d'un échange.
      frappant: Décrit une recherche marquée du contact et son rôle actif pour lancer ou animer des interactions.
  - id: torture
    family: Rapport à soi
    label: Torturé
    definition: Exprime un conflit intérieur qui pèse sur le récit, une ambivalence difficile à résoudre ou des pensées pénibles qui reviennent.
    exclusions: [Diagnostic, Scène sombre seule, Émotion d'un tiers ou d'un personnage, Inquiétude ponctuelle seule]
    anchors:
      leger: Décrit une tension intérieure située entre deux envies.
      net: Explique comment des envies incompatibles ou une pensée récurrente l'affectent.
      frappant: Développe un conflit intérieur qui revient et pèse sur ses choix ou sa façon de raconter.
  - id: reveur
    family: Imagination
    label: Rêveur
    definition: Se projette dans un ailleurs et développe une rêverie ou un monde imaginé au-delà du point de départ.
    allow_fiction: true
    exclusions: [Simple réponse à une question imaginaire, Détail fourni par la question]
    anchors:
      leger: Ajoute une projection imaginaire personnelle.
      net: Prolonge la projection en une scène ou un ailleurs avec ses propres détails.
      frappant: Déploie une rêverie immersive qui donne une direction nouvelle au récit.
  - id: creativite
    family: Imagination
    label: Créativité
    definition: Invente une solution, une image ou un mécanisme original, ou combine des idées de manière inattendue.
    allow_fiction: true
    exclusions: [Longueur ou richesse lexicale seule, Reprise d'une idée de la question]
    anchors:
      leger: Ajoute une association singulière et précise.
      net: Combine des éléments inattendus ou propose une solution inhabituelle qui fonctionne dans le récit.
      frappant: Invente un mécanisme ou une image marquante qui transforme la prémisse.
